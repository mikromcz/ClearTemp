; ClearTemp cleanup category definitions (CCleaner winapp2.ini-inspired format,
; see src/CCleaner_format.txt for the original reference).
;
; This file is shipped with the plugin - user-specific state (checked categories,
; days combo values, UI language) lives separately in ClearTemp.ini instead.
;
; ENCODING: this file must be saved as ANSI / Windows-1250 (NOT UTF-8, with or without BOM).
; GeoGet's TIniFile reads ini files using the system codepage, so UTF-8-saved accented
; text (Label_CS=/Hint_CS=) reads back as garbage in-game even though it looks correct
; in a UTF-8-aware editor. Re-save as Windows-1250 after editing Czech text here.
;
; [Categories]          Display order of category checkboxes. Value = order weight (sorted ascending).
;
; Per-category section keys:
;   Label=               Checkbox caption (English)
;   Label_CS=            Checkbox caption (Czech) - used instead of Label when ClearTemp.ini has
;                         [Settings] Language=CS. Optional; falls back to Label if omitted.
;   Hint=                Checkbox tooltip (English)
;   Hint_CS=             Checkbox tooltip (Czech), same fallback rule as Label_CS
;   DetectFile=          Path that must exist, or the row is not shown at all. Omit to always show.
;   Default=             Initial checked state before any [LastState] exists (1/0). Default: 0
;   DaysOptions=         Comma list populating an editable "days old" combo next to the checkbox.
;                        Omit for a plain instant-delete checkbox (no age filtering).
;   AllowNotInDatabase=  If 1, a resolved days value of -2 means "delete if no geocache with a
;                        matching GC/WM/OC code exists in the database" (GEOGET_DB), instead of an
;                        age check. If DaysOptions= is also omitted, the category always behaves as
;                        if -2 were selected (no combo shown, no age concept, purely orphan cleanup).
;   FileKey1..N=         path|mask|flags
;                          path  - %GEOGET_DATADIR% / %GEOGET_SCRIPTDIR% / %GEOGET_COMMONDATADIR% expanded
;                          mask  - simple glob: *.*, *.ext or an exact file name
;                          flags - empty = direct children of path only
;                                  RECURSE = also walk subfolders
;                                  REMOVESELF = RECURSE, and afterward also removes the FileKey's
;                                  own folder if it (and its subfolders) end up empty -
;                                  but only for FileKeyN entries in a checked category
;
; [Settings]
;   EmptyFolderSweep1..N= Folders swept for now-empty subfolders after deletion (unconditional, not
;                        tied to which categories were checked). Supports the same %GEOGET_DATADIR% /
;                        %GEOGET_SCRIPTDIR% / %GEOGET_COMMONDATADIR% expansion as FileKey paths.

[Categories]
GeoGetUpdate=10
GeoGetScriptDownload=20
GeoGetTemp=30
GeoGetPQTemp=40
GeoGetOldFiles=50
GeoGetLog=60
GeoGetOfflineCache=70
GeoGetOfflineMaps=80
GeoGetOfflineInc=90
GeoGetSRTM=100
GeoGetAttach=110
GeoGetLast=115
GeoGetGgcCache=116
GeoGetGgpCache=117
GeoGetPolygonCache=118
ScriptAniMapa=120
ScriptCombine=130
ScriptCwgList2=135
ScriptDatePublished=137
ScriptDegree360=140
ScriptDiscover=150
ScriptGeoJarry=160
ScriptGeoKuk=164
ScriptGeoPuzzle=165
ScriptGipMaker=166
ScriptKeskomapa=167
ScriptLabForGg=168
ScriptLogator=170
ScriptLogsRepair=175
ScriptSeriesII=180
ScriptSpoiler=190
ScriptStator=200
MtpToolLib=210

